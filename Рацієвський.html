<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 50%;
        }
        .btn {
            background-color: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
        .close {
            position: absolute;
            right: 20px;
            top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button onclick="changeBackground()">Зміна фону</button>
<script>
    function changeBackground() {
        document.body.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
    }
</script>

<script>
    let name = "Василь";
    let admin = name;
    console.log(admin);
</script>

<script>
    var a = 2;
    var x = 1 + (a *= 2);
    console.log(x); // 5
</script>

<script>
    if ("0") {
        alert('Привіт');
    }
</script>

<input type="text" id="text">
<button id="btn">Клік</button>
<script>
    document.getElementById("btn").addEventListener("click", function() {
        alert(document.getElementById("text").value);
    });
</script>

<button id="openModal">Open Dialog</button>
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Coming Soon!</h2>
        <p>In the mean time, download the Comp Report and Everything Report to get more info on this property!</p>
        <button class="btn">Comp Report</button>
        <button class="btn">Everything Report™</button>
    </div>
</div>
<script>
    document.getElementById("openModal").addEventListener("click", function() {
        document.getElementById("modal").style.display = "flex";
    });
    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }
</script>
</body>
</html>
